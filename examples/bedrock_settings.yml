### This config file contains required core defaults that must be set, along with a handful of common optional settings.
### For a full list of available settings, see https://microsoft.github.io/graphrag/config/yaml/

### LLM settings ###
## There are a number of settings to tune the threading and token limits for LLM calls - check the docs.

models:
  # Option 2: AWS Bedrock (good for enterprise)
  default_chat_model:
    type: bedrock_chat
    model: us.anthropic.claude-3-7-sonnet-20250219-v1:0  # Fast and cheap
    #model: us.anthropic.claude-3-5-sonnet-20241022-v2:0
    aws_region: us-east-1  # Specify region directly
    #aws_profile: default  # Use the available AWS profile
    encoding_model: cl100k_base  # Specify tokenizer for Claude models
    model_supports_json: false
    max_tokens: 65536
    temperature: 0.5
    concurrent_requests: 80
    request_timeout: 300.0  # Increase timeout for retries
    max_retries: 100        # Maximum retry attempts for throttling (configurable via settings.yaml)
    
  default_embedding_model:
    type: bedrock_embedding
    model: amazon.titan-embed-text-v2:0
    model_supports_json: false
    aws_region: us-east-1  # Specify region directly
    #aws_profile: default  # Use the available AWS profile
    encoding_model: cl100k_base  # Specify tokenizer for embedding model
    concurrent_requests: 80
    request_timeout: 300.0
    max_retries: 100        # Maximum retry attempts for throttling (configurable via settings.yaml)

### Input settings ###

input:
  storage:
    type: file # or blob
    base_dir: "input"
  text_column: content  # This should contain the wiki doc content/matter
  title_column: title   # This column in CSV should contain wiki doc title
  file_type: csv # [csv, text, json]
  metadata: [page_id,title,full_url,status,description,space_key,space_name,space_id,parent_hierarchy_level,child_hierarchy_level,version_number,last_modified,last_modified_by,last_modified_by_email,content_length,label_count,tags,confluence_instance] # example metadata from confluence

chunks:
  size: 5000
  overlap: 500
  group_by_columns: [id]
  prepend_metadata: true
  chunk_size_includes_metadata: true

### Output/storage settings ###
## If blob storage is specified in the following four sections,
## connection_string and container_name must be provided

output:
  type: file # [file, blob, cosmosdb]
  base_dir: "output"
    
cache:
  type: file # [file, blob, cosmosdb]
  base_dir: "cache"

reporting:
  type: file # [file, blob, cosmosdb]
  base_dir: "logs"

vector_store:
  default_vector_store:
    type: lancedb
    db_uri: output/lancedb
    container_name: default
    overwrite: True

### Workflow settings ###

embed_text:
  model_id: default_embedding_model
  vector_store_id: default_vector_store

extract_graph:
  model_id: default_chat_model
  prompt: "tuned_prompts/extract_graph.txt"
  entity_types: [PERSON,ORGANIZATION,PROJECT,TECHNOLOGY_PLATFORM,INFRASTRUCTURE_COMPONENT,NETWORK_RESOURCE,SECURITY_ELEMENT,BUSINESS_PROCESS,SERVICE,DOCUMENT,SYSTEM_TOOL,METRIC,TIME_ELEMENT,ISSUE_INCIDENT,LOCATION,CONFIGURATION,DATA_STRUCTURE,WORKFLOW_ACTIVITY,GOVERNANCE_ENTITY,RESOURCE_ASSET]
  max_gleanings: 1
  concurrent_requests: 5

summarize_descriptions:
  model_id: default_chat_model
  prompt: "tuned_prompts/summarize_descriptions.txt"
  max_length: 500

entity_extraction:
  prompt: "prompts/entity_extraction.txt"


cluster_graph:
  max_cluster_size: 10

extract_claims:
  enabled: false
  model_id: default_chat_model
  prompt: "prompts/extract_claims.txt"
  description: "Any claims or facts that could be relevant to information discovery."
  max_gleanings: 1

community_reports:
  model_id: default_chat_model
  graph_prompt: "tuned_prompts/community_report_graph.txt"
  text_prompt: "prompts/community_report_text.txt"
  max_length: 200
  max_input_length: 1000
  concurrent_requests: 5

# required for the streamlit unified search app
embed_graph:
  enabled: true # if true, will generate node2vec embeddings for nodes

# required for the streamlit unified search app
umap:
  enabled: true # if true, will generate UMAP embeddings for nodes (embed_graph must also be enabled)

snapshots:
  graphml: false
  embeddings: false

### Query settings ###
## The prompt locations are required here, but each search method has a number of optional knobs that can be tuned.
## See the config docs: https://microsoft.github.io/graphrag/config/yaml/#query

local_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/local_search_system_prompt.txt"

global_search:
  chat_model_id: default_chat_model
  map_prompt: "prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "prompts/global_search_knowledge_system_prompt.txt"

drift_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/drift_search_system_prompt.txt"
  reduce_prompt: "prompts/drift_search_reduce_prompt.txt"

basic_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/basic_search_system_prompt.txt"
